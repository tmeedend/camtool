[ABOUT]
NAME = CamTool 3
AUTHOR = tmeedend
VERSION = 0.1
DESCRIPTION = Cinematic replay camera. Reads and plays back CamTool 2 camera files: keyframes along the track, car tracking, recorded splines, FOV and DOF. Read only for now, and it never touches CamTool 2.

[CORE]
; PARTIAL: load on first open, then keep running until Assetto Corsa closes.
; FULL would unload the app when its window is closed, which stops the camera
; dead -- and watching a replay is exactly when you do not want a panel on
; screen. Note the consequence: closing the window while a camera is held keeps
; it held, so reopen the app to release it.
LAZY = PARTIAL

[WINDOW_...]
ID = main
NAME = CamTool 3
FUNCTION_MAIN = windowMain
MIN_SIZE = 320, 400
SIZE = 360, 620

; Drives the camera every frame whether or not the window is open.
[SIM_CALLBACKS]
WORLD_UPDATE = simUpdate
